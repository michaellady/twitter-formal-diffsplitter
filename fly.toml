# Fly.io config for twitter-formal-diffsplitter (the cross-impl proxy).
# Created by Stream 2 Phase 1.
#
# Manual setup before first deploy (see DEPLOY.md):
#   1. flyctl auth login
#   2. flyctl apps create twitter-formal-diffsplitter --org personal
#   3. flyctl volumes create diffsplitter_data --app twitter-formal-diffsplitter \
#        --region iad --size 1
#   4. flyctl secrets set --app twitter-formal-diffsplitter \
#        RUST_PRIMARY_ADMIN_TOKEN=<token>  GO_SHADOW_ADMIN_TOKEN=<token>
#   5. flyctl tokens create deploy --app twitter-formal-diffsplitter
#      and push that token into the GitHub repo's FLY_API_TOKEN secret.

app = "twitter-formal-diffsplitter"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RUST_LOG = "info"
  BACKEND_PRIMARY_URL = "https://twitter-formal-rust.fly.dev"
  BACKEND_SHADOW_URL  = "https://twitter-formal-go.fly.dev"
  SHADOW_SAMPLE_RATE  = "0.1"
  SQLITE_PATH         = "/data/diffsplitter.db"
  VERSION_POLL_INTERVAL_SECS = "5"
  MAX_WRITE_ATTEMPTS  = "5"

# Single 1GB volume at /data for the SQLite write queue + diffs table.
# Single-machine app so we don't need volume forks across regions.
[[mounts]]
  source = "diffsplitter_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the proxy alive — auto-stop would defeat the durable queue worker.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/_diffsplitter/healthz"

[vm]
  size = "shared-cpu-1x"
  memory = "512mb"
